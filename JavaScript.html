  function $(id) {
    return document.getElementById(id);
  }


  function setText(id, value) {

    var element = $(id);

    if (element) {
      element.textContent =
        value === null ||
        value === undefined ||
        value === ''
          ? '—'
          : String(value);
    }

  function showElement(id) {

  function safeNumber(value) {

    var number = Number(value);

    return isNaN(number) ? 0 : number;

  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return '';
    }

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function escapeAttribute(value) {
    return escapeHtml(value);
  }


  /* =======================================================
     DATE / NUMBER FORMATTING
     ======================================================= */

  function parseDate(value) {

    if (!value) {
      return null;
    }

    if (value instanceof Date) {
      return value;
    }

    var date = new Date(value);

    if (isNaN(date.getTime())) {
      return null;
    }

    return date;

  }


  function formatDate(value) {

    var date = parseDate(value);

    if (!date) {
      return '—';
    }

    return UtilitiesSafeDate(date);

  }


  function UtilitiesSafeDate(date) {

    var year = date.getFullYear();
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');

    return year + '-' + month + '-' + day;

  }


  function formatDateTime(value) {

    var date = parseDate(value);

    if (!date) {
      return '—';
    }

    var year = date.getFullYear();
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');

    var hours = String(date.getHours()).padStart(2, '0');
    var minutes = String(date.getMinutes()).padStart(2, '0');
    var seconds = String(date.getSeconds()).padStart(2, '0');

    return (
      year +
      '-' +
      month +
      '-' +
      day +
      ' ' +
      hours +
      ':' +
      minutes +
      ':' +
      seconds
    );

  }


  function formatMoney(value) {

    var amount = safeNumber(value);

    var currency =
      APP.state.settings &&
      APP.state.settings.currency
        ? APP.state.settings.currency
        : APP.config.currency;

    return (
      currency +
      ' ' +
      amount.toLocaleString(
        undefined,
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      )
    );

  }


  function formatNumber(value) {

    return safeNumber(value).toLocaleString(
      undefined,
      {
        maximumFractionDigits: 2
      }
    );

  }


  function formatRate(value) {

    var rate = safeNumber(value);

    if (rate > 1) {
      rate = rate / 100;
    }

    return (rate * 100).toFixed(2) + '%';

  }


  /* =======================================================
     STATUS BADGES
     ======================================================= */

  function statusClass(status) {

    if (!status) {
      return 'pending';
    }

    return String(status)
      .toLowerCase()
      .replace(/\s+/g, '-');

  }


  function statusBadge(status) {

      '">' +
      escapeHtml(safeStatus) +

/* =======================================================
   SERVER RESPONSE UNWRAPPER
   ======================================================= */
function unwrapServerResult(result) {
  if (!result) {
    throw new Error('Received empty response from server.');
  }

  if (typeof result === 'object' && result !== null && 'success' in result) {
    if (result.success === true) {
      return result.data;
    } else {
      throw new Error(result.error || result.message || 'Server returned an unsuccessful response.');
    }
  }

  return result;
}
  /* =======================================================
     SERVER COMMUNICATION
     ======================================================= */
function callServer(functionName) {

  var args = Array.prototype.slice.call(arguments, 1);

  return new Promise(function (resolve, reject) {

    if (
      typeof google === 'undefined' ||
      !google.script ||
      !google.script.run
    ) {

      reject(
        new Error(
          'Google Apps Script connection is unavailable.'
        )
      );

      return;
    }

    var runner =
      google.script.run
        .withSuccessHandler(function (result) {

          try {

            console.log(
              '[SERVER SUCCESS]',
              functionName,
              result
            );

            var data =
              unwrapServerResult(result);

            console.log(
              '[SERVER DATA]',
              functionName,
              data
            );

            resolve(data);

          } catch (error) {

            console.error(
              '[SERVER RESPONSE ERROR]',
              functionName,
              error
            );

            reject(error);

          }

        })
        .withFailureHandler(function (error) {

          console.error(
            '[SERVER FAILURE]',
            functionName,
            error
          );

          var message =
            error &&
            error.message
              ? error.message
              : String(
                  error ||
                  'Unknown server error.'
                );

          reject(
            new Error(
              functionName +
              ': ' +
              message
            )
          );

        });

    try {

      // Invoke server function directly without the property-type check
      runner[functionName].apply(
        runner,
        args
      );

    } catch (error) {

      console.error(
        '[CALL SERVER ERROR]',
        functionName,
        error
      );

      reject(error);

    }

  });

}

  /* =======================================================
     TOAST
     ======================================================= */

  var toastTimer = null;


  function showToast(
    message,
    type,
    title
  ) {

    var toast = $('toast');

    if (!toast) {
      return;
    }

    type = type || 'success';

    title =
      title ||
      (
        type === 'error'
          ? 'Error'
          : type === 'warning'
            ? 'Warning'
            : 'Success'
      );


    toast.classList.remove(
      'error',
      'warning'
    );


    if (type === 'error') {
      toast.classList.add('error');
    }

    if (type === 'warning') {
      toast.classList.add('warning');
    }


    setText(
      'toastTitle',
      title
    );

    setText(
      'toastMessage',
      message
    );


    setText(
      'toastIcon',
      type === 'error'
        ? '!'
        : type === 'warning'
          ? '!'
          : '✓'
    );


    toast.classList.add('show');


    if (toastTimer) {
      clearTimeout(toastTimer);
    }


    toastTimer =
      setTimeout(
        hideToast,
        5000
      );

  }


  function hideToast() {

    var toast = $('toast');

    if (toast) {
      toast.classList.remove('show');
    }

  }


  /* =======================================================

  function setConnectionStatus(
    connected,
    message
  ) {

    var element =
      $('connectionStatus');

    var text =
      $('connectionStatusText');


    if (!element) {
      return;
    }


    element.classList.remove(
      'connected',
      'error'
    );


    if (connected === true) {

      element.classList.add(
        'connected'
      );

      if (text) {
        text.textContent =
          message || 'Connected';
      }

      return;
    }


    if (connected === false) {

      element.classList.add(
        'error'
      );

      if (text) {
        text.textContent =
          message || 'Connection error';
      }

      return;
    }


    if (text) {
      text.textContent =
        message || 'Connecting...';
    }

  }

  async function navigateToPage(page) {

    if (
      !APP.config.pageTitles[page] &&
      page !== 'customer-detail' &&
      page !== 'loan-detail'
    ) {
      page = 'dashboard';
    }


    APP.state.currentPage = page;


    var sections =
      document.querySelectorAll(
        '.page-section'
      );


    sections.forEach(function (section) {

      section.classList.remove(
        'active'
      );

    });


    var target =
      $('page-' + page);

    if (target) {

      target.classList.add(
        'active'
      );

    }


    var navItems =
      document.querySelectorAll(
        '.nav-item[data-page]'
      );


    navItems.forEach(function (item) {

      item.classList.toggle(
        'active',
        item.getAttribute(
          'data-page'
        ) === page
      );

    });


    var pageInfo =
      APP.config.pageTitles[page];


    if (pageInfo) {

      setText(
        'pageTitle',
        pageInfo.title
      );

      setText(
        'pageSubtitle',
        pageInfo.subtitle
      );

    }


    closeMobileMenu();


    try {

      if (page === 'dashboard') {
        await loadDashboard();
      }

      else if (page === 'customers') {
        await loadCustomers();
      }

      else if (page === 'loans') {
        await loadLoans();
      }

      else if (page === 'payments') {
        await loadPayments();
      }

      else if (page === 'collections') {
        await loadCollections();
      }

      else if (page === 'interest') {
        await loadInterest();
      }

      else if (page === 'transactions') {
        await loadTransactions();
      }

      else if (page === 'reports') {
        await loadReports();
      }

      else if (page === 'audit') {
        await loadAuditLog();
      }

      else if (page === 'settings') {
        await loadSettings();
      }

    } catch (error) {

      showToast(
        error.message,
        'error'
      );

    }

  }

  function setupSearchEvents() {

    setupSearch(
      'customerSearch',
      renderCustomers
    );

    setupSearch(
      'loanSearch',
      renderLoans
    );

    setupSearch(
      'paymentSearch',
      renderPayments

    setupSearch(

      renderTransactions

    setupSearch(
      'auditSearch',
      renderAuditLog
    );

  }


  function setupSearch(
    inputId,
    renderFunction
  ) {

    var input =
      $(inputId);

    if (!input) {
      return;
    }


    input.addEventListener(
      'input',
      function () {
        renderFunction(
          getFilteredData(
            input.value,
            inputId
          )
        );
      }
    );

  }


  function getFilteredData(
    search,
    inputId
  ) {

    var query =
      String(search || '')
        .trim()
        .toLowerCase();


    if (!query) {

      if (inputId === 'customerSearch') {
        return APP.state.customers;
      }

      if (inputId === 'loanSearch') {
        return APP.state.loans;
      }

      if (inputId === 'paymentSearch') {
        return APP.state.payments;
      }

      if (inputId === 'collectionSearch') {
        return APP.state.collections;
      }

      if (inputId === 'interestSearch') {
        return APP.state.interest;
      }

      if (inputId === 'transactionSearch') {
        return APP.state.transactions;
      }

      if (inputId === 'auditSearch') {
        return APP.state.audit;
      }

    }


    var source = [];


    if (inputId === 'customerSearch') {
      source = APP.state.customers;
    }

    else if (inputId === 'loanSearch') {
      source = APP.state.loans;
    }

    else if (inputId === 'paymentSearch') {
      source = APP.state.payments;
    }

    else if (inputId === 'collectionSearch') {
      source = APP.state.collections;
    }

    else if (inputId === 'interestSearch') {
      source = APP.state.interest;
    }

    else if (inputId === 'transactionSearch') {
      source = APP.state.transactions;
    }

    else if (inputId === 'auditSearch') {
      source = APP.state.audit;
    }


    return source.filter(
      function (item) {

        return Object.keys(item || {})
          .some(
            function (key) {

              return String(
                item[key] === null ||
                item[key] === undefined
                  ? ''
                  : item[key]
              )
                .toLowerCase()
                .indexOf(query) !== -1;

            }
          );

      }
    );

  }


  /* =======================================================
     APPLICATION INITIALIZATION
     ======================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    initializeApplication
  );


  async function initializeApplication() {

    try {

      setupNavigation();
      setupMobileMenu();
      setupGlobalButtons();
      setupModalEvents();
      setupSearchEvents();

      setConnectionStatus(
        null,
        'Connecting...'
      );


      await loadApplication();


      setConnectionStatus(
        true,
        'Connected'
      );


    } catch (error) {

      console.error(error);

      setConnectionStatus(
        false,
        'Connection error'
      );

      showFatalError(
        error.message
      );

    }

  }


  async function loadApplication() {

    showLoading(
      'Starting system',
      'Loading dashboard and system information...'
    );


    try {

      var results =
        await Promise.all([
          callServer(
            'getDashboardData'
          ),

          callServer(
            'getSystemInfo'
          ),

          callServer(
            'getCustomers'
          ),

          callServer(
            'getLoans'
          )
        ]);


      APP.state.customers =
        Array.isArray(results[2])
          ? results[2]
          : [];


      APP.state.loans =
        Array.isArray(results[3])
          ? results[3]
          : [];


      APP.state.systemInfo =
        results[1] || null;


      updateSystemUI(
        APP.state.systemInfo
      );


      renderDashboard(
        results[0] || {}
      );


      navigateToPage(
        'dashboard'
      );


      await loadAutomationStatus();


      hideLoading();


    } catch (error) {

      hideLoading();

      throw error;

    }

  }

  async function loadSystemInformation() {

    var info =
      await callServer(
        'getSystemInfo'
      );

    APP.state.systemInfo =
      info || null;

    updateSystemUI(
      APP.state.systemInfo
    );

    return info;

  }


  function updateSystemUI(info) {

    if (!info) {
      return;
    }


    setText(
      'sidebarVersion',

      (
        info.version ||
        '1.0.0'
      )
    );


    setText(
      'sidebarUserName',
      info.administrator ||
      'Administrator'
    );


    var avatar =
      $('sidebarUserAvatar');

    if (avatar) {

      var name =
        info.administrator ||
        'Administrator';

      avatar.textContent =
        String(name)
          .trim()
          .charAt(0)
          .toUpperCase();

    }


    setText(
      'sidebarBusinessName',
      info.businessName ||
      'My Loan Business'
    );


    setText(
      'systemName',
      info.systemName
    );

    setText(
      'systemVersion',
      info.version
    );

    setText(
      'systemSpreadsheet',
      info.spreadsheetName
    );

    setText(
      'systemSheetCount',
      info.sheetCount
    );

    setText(
      'systemCurrency',
      info.currency
    );

    setText(
      'systemTimezone',
      info.timezone
    );

  function renderSettings(
    settings
  ) {

    if (!settings) {
      return;
    }


    var businessName =
      getSettingValue(
        settings,
        [
          'businessName',
          'Business Name'
        ]
      );


    var currency =
      getSettingValue(
        settings,
        [
          'currency',
          'Currency'
        ]
      );


    var rate =
      getSettingValue(
        settings,
        [
          'defaultInterestRate',
          'Default Interest Rate'
        ]
      );


    var term =
      getSettingValue(
        settings,
        [
          'defaultLoanTerm',
          'Default Loan Term'
        ]
      );


    var grace =
      getSettingValue(
        settings,
        [
          'gracePeriod',
          'Grace Period'
        ]
      );


    var compounding =
      getSettingValue(
        settings,
        [
          'compoundingEnabled',
          'Compounding Enabled',
          'Compounding'
        ]
      );


    var allocation =
      getSettingValue(
        settings,
        [
          'paymentAllocationMethod',
          'Payment Allocation Method',
          'Payment Allocation'
        ]
      );


    setText(
      'settingBusinessName',
      businessName || 'My Loan Business'
    );


    setText(
      'settingCurrency',
      currency || 'MWK'
    );


    setText(
      'settingInterestRate',
      formatRate(
        rate === undefined
          ? 0.40
          : rate
      )
    );


    setText(
      'settingLoanTerm',
      formatNumber(
        term === undefined
          ? 30
          : term
      ) + ' days'
    );


    setText(
      'settingGracePeriod',
      formatNumber(
        grace === undefined
          ? 0
          : grace
      ) + ' days'
    );


    var compoundingElement =
      $('settingCompounding');


    if (compoundingElement) {

      var enabled =
        String(
          compounding
        ).toLowerCase() === 'yes' ||
        String(
          compounding
        ).toLowerCase() === 'true' ||
        compounding === true;


      compoundingElement.textContent =
        enabled

          : 'Disabled';


      compoundingElement.className =
        'status-badge ' +
        (
          enabled
            ? 'active'
            : 'closed'
        );

    }


    setText(
      'settingAllocation',
      allocation ||
      'Outstanding Balance'
    );


    if (businessName) {
      setText(
        'sidebarBusinessName',
        businessName
      );
    }

  function getSettingValue(
    settings,
    names
  ) {

    if (
      !settings ||
      typeof settings !== 'object'
    ) {
      return undefined;
    }


    for (
      var i = 0;
      i < names.length;
      i++
    ) {

      var name =
        names[i];


      if (
        Object.prototype.hasOwnProperty.call(
          settings,
          name
        )
      ) {

        return settings[name];

      }

    }


    return undefined;

  }

  async function loadAutomationStatus() {

    try {

      var status =
        await callServer(
          'getAutomationStatus'
        );


      APP.state.automation =
        status || {};


      renderAutomationStatus(
        APP.state.automation
      );


      return status;

        'Automation status:',
        error
      );

      return null;

    }

  function renderAutomationStatus(
    status
  ) {

    if (!status) {
      return;
    }


    var indicator =
      $('automationIndicator');

    var title =
      $('automationTitle');

    var description =
      $('automationDescription');


    if (!indicator) {
      return;
    }


    indicator.classList.remove(
      'enabled',
      'disabled'
    );


    if (status.enabled) {

      indicator.classList.add(
        'enabled'
      );


      if (title) {
        title.textContent =
          'Daily automation is active';
      }


      if (description) {

        description.textContent =
          status.message ||
          'Interest processing is scheduled daily.';

      }

    } else {

      indicator.classList.add(
        'disabled'
      );


      if (title) {
        title.textContent =
          'Daily automation is disabled';
      }


      if (description) {

        description.textContent =
          status.message ||
          'Daily interest processing is not scheduled.';

      }

    }

  }

  function setupModalEvents() {

    var close =
      $('modalClose');

    if (close) {

      close.addEventListener(
        'click',
        closeModal
      );

    }


    var overlay =
      $('modalOverlay');

    if (overlay) {

      overlay.addEventListener(
        'click',
        function (event) {

          if (
            event.target === overlay
          ) {

            closeModal();

          }

        }
      );

    }


    var toastClose =
      $('toastClose');

    if (toastClose) {

      toastClose.addEventListener(
        'click',
        hideToast
      );

    }


    document.addEventListener(
      'keydown',
      function (event) {

        if (
          event.key === 'Escape'
        ) {

          closeModal();

        }

      }
    );

  }


  function openModal(
    title,
    subtitle,
    body,
    footer
  ) {

    setText(
      'modalTitle',
      title
    );

    setText(
      'modalSubtitle',
      subtitle || ''
    );


    var modalBody =
      $('modalBody');

    var modalFooter =
      $('modalFooter');


    if (modalBody) {
      modalBody.innerHTML =
        body || '';
    }


    if (modalFooter) {
      modalFooter.innerHTML =
        footer || '';
    }


    var overlay =
      $('modalOverlay');


    if (overlay) {

      overlay.classList.add(
        'show'
      );

      overlay.setAttribute(
        'aria-hidden',
        'false'
      );

    }

  }


  function closeModal() {

    var overlay =
      $('modalOverlay');


    if (overlay) {

      overlay.classList.remove(
        'show'
      );

      overlay.setAttribute(
        'aria-hidden',
        'true'
      );

    }

  }

async function saveCustomer() {

  var name =
    valueOf(
      'customerName'
    );

  var phone =
    valueOf(
      'customerPhone'
    );


  if (!name) {

    showToast(
      'Customer name is required.',
      'error'
    );

    return;

  }


  if (!phone) {

    showToast(
      'Customer phone number is required.',
      'error'
    );

    return;

  }


  var data = {

    name: name,

    phone: phone,

    alternativePhone:
      valueOf(
        'customerAlternativePhone'
      ),

    address:
      valueOf(
        'customerAddress'
      ),

    idReference:
      valueOf(
        'customerIdReference'
      ),

    occupationBusiness:
      valueOf(
        'customerOccupation'
      ),

    notes:
      valueOf(
        'customerNotes'
      )

  };


  closeModal();


  showLoading(
    'Saving customer',
    'Creating customer record...'
  );


  try {

    var result =
      await callServer(
        'createCustomerFromWebApp',
        data
      );


    /*
     * Protect against a null or empty server response.
     */

    var customerId = '';

    if (result) {

      customerId =
        result.customerId ||
        result.id ||
        '';

    }


    /*
     * Refresh the actual data from the server.
     */

    await Promise.all([
      loadCustomers(false),
      loadDashboard(false)
    ]);


    /*
     * Show success only after the customer
     * has been successfully saved and the
     * data has been refreshed.
     */

    if (customerId) {

      showToast(
        'Customer ' +
        customerId +
        ' created successfully.'
      );

    } else {

      showToast(
        'Customer created successfully.'
      );

    }


    navigateToPage(
      'customers'
    );


  } catch (error) {

    console.error(
      '[SAVE CUSTOMER ERROR]',
      error
    );


    showToast(
      error && error.message
        ? error.message
        : String(error),
      'error'
    );


  } finally {

    hideLoading();

  }

}

  }


  function calculateCollectionStatus() {

    var promised =
      safeNumber(
        valueOf(
          'collectionAmountPromised'
        )
      );

    var received =
      safeNumber(
        valueOf(
          'collectionAmountReceived'
        )
      );


    if (
      received > 0 &&
      promised > 0 &&
      received >= promised
    ) {

      return 'Paid';

    }


    if (received > 0) {
      return 'Partially Paid';
    }


    if (
      valueOf(
        'collectionPromiseDate'
      )
    ) {

      return 'Promise to Pay';

    }


    return 'Contacted';

  }


  /* =======================================================

     ======================================================= */

  function formGroup(
    label,
    id,
    type,
    value,
    required,
    help
  ) {

    return (

      '<div class="form-group">' +

      '<label class="form-label" ' +
      'for="' +
      escapeAttribute(
        id
      ) +
      '">' +

      escapeHtml(
        label
      ) +

      (
        required
          ? ' <span class="required">*</span>'
          : ''
      ) +

      '</label>' +

      '<input ' +

      'class="form-input" ' +

      'type="' +
      escapeAttribute(
        type
      ) +
      '" ' +

      'id="' +
      escapeAttribute(
        id
      ) +
      '" ' +

      'value="' +
      escapeAttribute(
        value || ''
      ) +
      '" ' +

      (
        required
          ? 'required '
          : ''
      ) +

      '>' +

      (
        help
          ? '<div class="form-help">' +
            escapeHtml(
              help
            ) +
            '</div>'
          : ''
      ) +

      '</div>'

    );

  }


  function valueOf(id) {

    var element =
      $(id);

    return element
      ? String(
          element.value || ''
        ).trim()
      : '';

  }


  function bindModalButton(
    id,
    handler
  ) {

    var button =
      $(id);

    if (!button) {
      return;
    }


    button.addEventListener(
      'click',
      handler
    );

  }


  function todayInputDate() {

    var now =
      new Date();

    return (
      now.getFullYear() +
      '-' +
      String(
        now.getMonth() + 1
      ).padStart(2, '0') +
      '-' +
      String(
        now.getDate()
      ).padStart(2, '0')
    );

  }


  /* =======================================================

     ======================================================= */

  function showFatalError(
    message
  ) {

    var element =
      $('fatalError');

    var messageElement =
      $('fatalErrorMessage');


    if (messageElement) {

      messageElement.textContent =
        message ||
        'The application could not start.';

    }


    if (element) {

      element.style.display =
        'flex';

    }

  }
