<style>

:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #eff6ff;

  --success: #16a34a;
  --success-light: #f0fdf4;

  --warning: #d97706;
  --warning-light: #fffbeb;

  --danger: #dc2626;
  --danger-light: #fef2f2;

  --info: #0891b2;
  --info-light: #ecfeff;

  --text: #172033;
  --text-secondary: #667085;
  --text-muted: #98a2b3;

  --border: #e4e7ec;
  --border-light: #f0f2f5;

  --background: #f6f8fb;
  --surface: #ffffff;

  --sidebar: #101828;
  --sidebar-secondary: #182230;
  --sidebar-text: #d0d5dd;
  --sidebar-muted: #667085;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, .07);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .12);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --sidebar-width: 255px;
  --topbar-height: 76px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  color: var(--text);
  background: var(--background);
}

body {
  font-size: 14px;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

a {
  color: inherit;
  text-decoration: none;
}


/* =========================================================
   APPLICATION SHELL
   ========================================================= */

.app-shell {
  min-height: 100vh;
  display: flex;
}

.main-shell {
  min-width: 0;
  flex: 1;
  margin-left: var(--sidebar-width);
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;

  width: var(--sidebar-width);

  display: flex;
  flex-direction: column;

  background: var(--sidebar);
  color: var(--sidebar-text);

  z-index: 1000;
}

.sidebar-header {
  height: 76px;
  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid rgba(255,255,255,.06);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-icon {
  width: 38px;
  height: 38px;

  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--primary);
  color: white;

  font-weight: 800;
  font-size: 12px;
}

.brand-title {
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}

.brand-subtitle {
  color: #98a2b3;
  font-size: 10px;
  margin-top: 2px;
}

.sidebar-close {
  display: none;

  width: 34px;
  height: 34px;

  border: 0;
  border-radius: 7px;

  background: transparent;
  color: #98a2b3;

  font-size: 24px;
}

.sidebar-business {
  padding: 18px 18px 12px;
}

.business-label {
  color: #667085;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  margin-bottom: 5px;
}

.business-name {
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px;
}

.nav-section-label {
  padding: 15px 10px 7px;

  color: #667085;

  font-size: 9px;
  font-weight: 700;

  letter-spacing: .12em;
}

.nav-item {
  width: 100%;

  border: 0;
  border-radius: 7px;

  background: transparent;
  color: var(--sidebar-text);

  padding: 10px 11px;

  display: flex;
  align-items: center;

  gap: 11px;

  text-align: left;

  transition:
    background .15s ease,
    color .15s ease;
}

.nav-item:hover {
  background: rgba(255,255,255,.06);
  color: #fff;
}

.nav-item.active {
  background: rgba(37,99,235,.22);
  color: #fff;
}

.nav-icon {
  width: 19px;
  text-align: center;
  font-size: 15px;
  opacity: .85;
}

.nav-label {
  font-size: 13px;
  font-weight: 500;
}

.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 14px;
}

.system-version {
  display: flex;
  justify-content: space-between;

  color: #667085;

  font-size: 10px;

  margin-bottom: 12px;
}

.system-version strong {
  color: #98a2b3;
}

.sidebar-user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #344054;
  color: #fff;

  font-size: 12px;
  font-weight: 700;
}

.user-name {
  color: #fff;
  font-size: 12px;
  font-weight: 600;
}

.user-role {
  color: #667085;
  font-size: 10px;
  margin-top: 2px;
}


/* =========================================================
   TOPBAR
   ========================================================= */

.topbar {
  height: var(--topbar-height);

  position: sticky;
  top: 0;

  z-index: 100;

  background: rgba(255,255,255,.96);

  border-bottom: 1px solid var(--border);

  padding: 0 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  backdrop-filter: blur(10px);
}

.topbar-left {
  display: flex;
  align-items: center;
  min-width: 0;
}

.page-heading h1 {
  margin: 0;
  font-size: 21px;
  line-height: 1.2;
  font-weight: 700;
}

.page-heading p {
  margin: 4px 0 0;
  color: var(--text-secondary);
  font-size: 12px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.topbar-action {
  height: 36px;

  border: 1px solid var(--border);
  border-radius: 7px;

  padding: 0 12px;

  background: #fff;
  color: var(--text);

  display: flex;
  align-items: center;
  gap: 6px;

  font-size: 12px;
  font-weight: 600;
}

.topbar-action:hover {
  background: #f9fafb;
}

.topbar-action.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.topbar-action.primary:hover {
  background: var(--primary-dark);
}

.connection-status {
  height: 32px;

  padding: 0 9px;

  display: flex;
  align-items: center;
  gap: 6px;

  color: var(--text-secondary);

  font-size: 11px;
}

.connection-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--warning);
}

.connection-status.connected .connection-dot {
  background: var(--success);
}

.connection-status.error .connection-dot {
  background: var(--danger);
}

.mobile-menu-button {
  display: none;

  border: 0;
  background: transparent;

  width: 38px;
  height: 38px;

  margin-right: 8px;

  font-size: 21px;
}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.main-content {
  padding: 28px;
  max-width: 1800px;
  margin: 0 auto;
}

.page-section {
  display: none;
}

.page-section.active {
  display: block;
}

.section-toolbar {
  margin-bottom: 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;
}

.section-toolbar h2 {
  margin: 0;

  font-size: 18px;
  font-weight: 700;
}

.section-toolbar p {
  margin: 4px 0 0;

  color: var(--text-secondary);

  font-size: 12px;
}

.toolbar-actions {
  display: flex;
  gap: 8px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button {
  min-height: 36px;

  border: 1px solid var(--border);
  border-radius: 7px;

  padding: 0 13px;

  background: #fff;
  color: var(--text);

  font-size: 12px;
  font-weight: 600;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;

  transition: all .15s ease;
}

.button:hover {
  background: #f9fafb;
  border-color: #cfd4dc;
}

.button.primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.button.primary:hover {
  background: var(--primary-dark);
}

.button.secondary {
  background: #fff;
}

.button.danger {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}


/* =========================================================
   DASHBOARD
   ========================================================= */

.dashboard-cards {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 14px;

  margin-bottom: 14px;
}

.stat-card {
  background: #fff;

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);

  padding: 18px;

  display: flex;
  align-items: flex-start;

  gap: 14px;

  box-shadow: var(--shadow-sm);
}

.stat-card-icon {
  width: 42px;
  height: 42px;

  flex-shrink: 0;

  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 17px;
  font-weight: 800;

  background: var(--primary-light);
  color: var(--primary);
}

.stat-card-icon.active-icon {
  background: var(--success-light);
  color: var(--success);
}

.stat-card-icon.overdue-icon {
  background: var(--danger-light);
  color: var(--danger);
}

.stat-label {
  color: var(--text-secondary);

  font-size: 11px;
  font-weight: 600;
}

.stat-value {
  margin-top: 5px;

  font-size: 25px;
  font-weight: 750;

  line-height: 1.1;
}

.stat-foot {
  margin-top: 5px;

  color: var(--text-muted);

  font-size: 10px;
}

.dashboard-financial-grid {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 14px;

  margin-bottom: 14px;
}

.financial-card {
  background: #fff;

  border: 1px solid var(--border);

  border-radius: var(--radius-lg);

  padding: 17px;

  box-shadow: var(--shadow-sm);
}

.financial-card.highlight {
  border-color: #bfdbfe;
  background: #f8fbff;
}

.financial-label {
  color: var(--text-secondary);

  font-size: 11px;
  font-weight: 600;
}

.financial-value {
  margin-top: 7px;

  font-size: 19px;
  font-weight: 750;
}

.dashboard-lower-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 14px;
}

.panel {
  background: #fff;

  border: 1px solid var(--border);

  border-radius: var(--radius-lg);

  box-shadow: var(--shadow-sm);

  overflow: hidden;
}

.panel-header {
  min-height: 64px;

  padding: 15px 18px;

  border-bottom: 1px solid var(--border-light);

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-header h3 {
  margin: 0;

  font-size: 14px;
  font-weight: 700;
}

.panel-header p {
  margin: 3px 0 0;

  color: var(--text-muted);

  font-size: 10px;
}

.portfolio-status-list {
  padding: 5px 18px 12px;
}

.portfolio-row {
  min-height: 44px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--border-light);
}

.portfolio-row:last-child {
  border-bottom: 0;
}

.portfolio-label {
  display: flex;
  align-items: center;
  gap: 8px;

  color: var(--text-secondary);

  font-size: 12px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.status-dot.active {
  background: var(--success);
}

.status-dot.overdue {
  background: var(--danger);
}

.status-dot.paid {
  background: var(--primary);
}

.status-dot.closed {
  background: #98a2b3;
}

.alert-list {
  padding: 5px 18px 12px;
}

.alert-row {
  min-height: 59px;

  display: flex;
  align-items: center;

  gap: 11px;

  border-bottom: 1px solid var(--border-light);
}

.alert-row:last-child {
  border-bottom: 0;
}

.alert-icon {
  width: 30px;
  height: 30px;

  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 800;
}

.alert-icon.danger {
  background: var(--danger-light);
  color: var(--danger);
}

.alert-icon.warning {
  background: var(--warning-light);
  color: var(--warning);
}

.alert-content {
  flex: 1;
}

.alert-title {
  font-size: 12px;
  font-weight: 650;
}

.alert-text {
  margin-top: 2px;

  color: var(--text-muted);

  font-size: 10px;
}

.alert-number {
  font-size: 15px;
}

.dashboard-footer-info {
  padding: 13px 2px 0;

  color: var(--text-muted);

  font-size: 10px;
}


/* =========================================================
   TABLES
   ========================================================= */

.table-toolbar {
  padding: 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  border-bottom: 1px solid var(--border-light);
}

.search-box {
  min-width: 280px;
  max-width: 500px;
  flex: 1;

  height: 36px;

  border: 1px solid var(--border);
  border-radius: 7px;

  background: #fff;

  display: flex;
  align-items: center;

  padding: 0 10px;

  transition: border .15s ease;
}

.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,.08);
}

.search-icon {
  color: var(--text-muted);
  font-size: 18px;
  margin-right: 7px;
}

.search-box input {
  border: 0;
  outline: 0;

  width: 100%;

  background: transparent;

  color: var(--text);

  font-size: 12px;
}

.table-container {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;

  border-collapse: collapse;

  min-width: 850px;
}

.data-table th {
  padding: 11px 14px;

  background: #f8fafc;

  border-bottom: 1px solid var(--border);

  color: var(--text-secondary);

  font-size: 10px;
  font-weight: 700;

  text-align: left;

  white-space: nowrap;
}

.data-table td {
  padding: 12px 14px;

  border-bottom: 1px solid var(--border-light);

  font-size: 11px;

  vertical-align: middle;
}

.data-table tbody tr:hover {
  background: #fafcff;
}

.table-link {
  color: var(--primary);
  font-weight: 650;
  cursor: pointer;
}

.table-link:hover {
  text-decoration: underline;
}

.table-action {
  border: 0;

  background: transparent;

  color: var(--primary);

  padding: 4px 6px;

  font-size: 11px;
  font-weight: 650;
}

.empty-state {
  padding: 42px 20px !important;

  color: var(--text-muted);

  text-align: center;
}


/* =========================================================
   STATUS BADGES
   ========================================================= */

.status-badge {
  display: inline-flex;
  align-items: center;

  min-height: 23px;

  padding: 0 8px;

  border-radius: 999px;

  font-size: 10px;
  font-weight: 650;
}

.status-badge.active {
  background: var(--success-light);
  color: var(--success);
}

.status-badge.overdue {
  background: var(--danger-light);
  color: var(--danger);
}

.status-badge.paid {
  background: var(--primary-light);
  color: var(--primary);
}

.status-badge.closed {
  background: #f2f4f7;
  color: #667085;
}

.status-badge.pending {
  background: #f2f4f7;
  color: #667085;
}

.status-badge.promise-to-pay {
  background: var(--warning-light);
  color: var(--warning);
}

.status-badge.partially-paid {
  background: var(--info-light);
  color: var(--info);
}

.status-badge.escalated {
  background: var(--danger-light);
  color: var(--danger);
}


/* =========================================================
   REPORTS
   ========================================================= */

.report-cards {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 14px;

  margin-bottom: 14px;
}

.report-card {
  background: #fff;

  border: 1px solid var(--border);

  border-radius: var(--radius-lg);

  padding: 18px;

  box-shadow: var(--shadow-sm);
}

.report-card-label {
  color: var(--text-secondary);

  font-size: 11px;
  font-weight: 600;
}

.report-card-value {
  margin-top: 7px;

  font-size: 19px;
  font-weight: 750;
}

.report-panel {
  min-height: 200px;
}

.report-summary-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 1px;

  background: var(--border-light);
}

.report-summary-item {
  padding: 18px;
  background: #fff;
}

.report-summary-item span {
  display: block;

  color: var(--text-muted);

  font-size: 10px;
}

.report-summary-item strong {
  display: block;

  margin-top: 5px;

  font-size: 16px;
}


/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 14px;

  margin-bottom: 14px;
}

.settings-list {
  padding: 5px 18px 12px;
}

.setting-row {
  min-height: 61px;

  padding: 10px 0;

  border-bottom: 1px solid var(--border-light);

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-label {
  font-size: 12px;
  font-weight: 650;
}

.setting-description {
  margin-top: 3px;

  color: var(--text-muted);

  font-size: 10px;
}

.setting-row > strong {
  font-size: 12px;

  white-space: nowrap;
}

.automation-card {
  padding: 20px;
}

.automation-status {
  display: flex;
  align-items: center;
  gap: 12px;
}

.automation-indicator {
  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: var(--warning);

  box-shadow: 0 0 0 4px var(--warning-light);
}

.automation-indicator.enabled {
  background: var(--success);
  box-shadow: 0 0 0 4px var(--success-light);
}

.automation-indicator.disabled {
  background: var(--danger);
  box-shadow: 0 0 0 4px var(--danger-light);
}

.automation-title {
  font-size: 13px;
  font-weight: 700;
}

.automation-description {
  margin-top: 3px;

  color: var(--text-secondary);

  font-size: 11px;
}

.automation-actions {
  display: flex;
  flex-wrap: wrap;

  gap: 8px;

  margin-top: 18px;
}

.system-info-panel {
  padding-bottom: 18px;
}

.system-info-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 1px;

  background: var(--border-light);
}

.system-info-grid > div {
  background: #fff;
  padding: 15px 18px;
}

.system-info-grid span {
  display: block;

  color: var(--text-muted);

  font-size: 10px;
}

.system-info-grid strong {
  display: block;

  margin-top: 5px;

  font-size: 12px;

  overflow: hidden;
  text-overflow: ellipsis;
}


/* =========================================================
   DETAIL PAGES
   ========================================================= */

.detail-back {
  margin-bottom: 15px;
}

.detail-header {
  background: #fff;

  border: 1px solid var(--border);

  border-radius: var(--radius-lg);

  padding: 22px;

  margin-bottom: 14px;

  box-shadow: var(--shadow-sm);
}

.detail-header-top {
  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  gap: 20px;
}

.detail-title {
  margin: 0;

  font-size: 21px;
  font-weight: 750;
}

.detail-subtitle {
  margin-top: 5px;

  color: var(--text-secondary);

  font-size: 12px;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.detail-grid {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 1px;

  background: var(--border-light);

  margin-top: 20px;
}

.detail-stat {
  background: #fff;

  padding: 14px;
}

.detail-stat-label {
  color: var(--text-muted);

  font-size: 10px;
}

.detail-stat-value {
  margin-top: 5px;

  font-size: 14px;
  font-weight: 700;
}

.detail-two-column {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 14px;
}

.info-list {
  padding: 6px 18px 14px;
}

.info-row {
  min-height: 42px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 15px;

  border-bottom: 1px solid var(--border-light);
}

.info-row:last-child {
  border-bottom: 0;
}

.info-row span {
  color: var(--text-secondary);
  font-size: 11px;
}
